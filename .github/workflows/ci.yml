name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify backend
        run: ./gradlew --no-daemon verifyLostHubBe

      - name: Upload Fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: losthub-be-fat-jar
          path: build/libs/losthub-be-all.jar
          if-no-files-found: error

      - name: Upload Javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: losthub-be-javadoc
          path: build/docs/javadoc
          if-no-files-found: warn
